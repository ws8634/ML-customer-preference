<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦当劳用户喜好预测系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-box {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #cbd5e0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            color: #4a5568;
        }

        .result-value {
            font-size: 1.1em;
            font-weight: 700;
        }

        .result-value.positive {
            color: #48bb78;
        }

        .result-value.negative {
            color: #f56565;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .metric-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .metric-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .metric-label {
            color: #718096;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 15px;
        }

        .error-message {
            background: #fed7d7;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .model-info {
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .model-info h3 {
            color: #553c9a;
            margin-bottom: 10px;
        }

        .model-info ul {
            list-style: none;
            padding: 0;
        }

        .model-info li {
            padding: 5px 0;
            color: #553c9a;
        }

        .model-info li::before {
            content: "✓ ";
            color: #9f7aea;
            font-weight: bold;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .error-display {
            background: #fed7d7;
            border: 1px solid #fc8181;
            border-radius: 10px;
            padding: 20px;
            color: #c53030;
            text-align: center;
        }

        .error-display h4 {
            margin-bottom: 10px;
            color: #9b2c2c;
        }

        .error-display p {
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .error-display button {
            background: #fc8181;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .error-display button:hover {
            background: #f56565;
        }

        .global-error {
            background: #fed7d7;
            border: 2px solid #fc8181;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            color: #c53030;
            display: none;
        }

        .global-error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .global-error h4 {
            margin-bottom: 8px;
            color: #9b2c2c;
        }

        @media (max-width: 1000px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍔 麦当劳用户喜好预测系统</h1>

        <div id="globalError" class="global-error">
            <h4>⚠️ 系统错误</h4>
            <p id="globalErrorText">无法连接到服务器，请检查后端服务是否启动。</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📊 用户特征输入</h2>

                <div class="model-info">
                    <h3>模型信息</h3>
                    <div id="modelInfoContainer">
                        <ul id="modelInfoList">
                            <li>加载中...</li>
                        </ul>
                    </div>
                </div>

                <form id="predictionForm">
                    <div class="form-group">
                        <label for="age">年龄 *</label>
                        <input type="number" id="age" name="age" placeholder="请输入年龄 (18-100)" min="18" max="100" required>
                    </div>

                    <div class="form-group">
                        <label for="income">月收入 *</label>
                        <input type="number" id="income" name="income" placeholder="请输入月收入 (≥ 0)" min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">性别 *</label>
                        <select id="gender" name="gender" required>
                            <option value="">请选择性别</option>
                            <option value="male">男性</option>
                            <option value="female">女性</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="visit_frequency">访问频率 *</label>
                        <select id="visit_frequency" name="visit_frequency" required>
                            <option value="">请选择访问频率</option>
                            <option value="rarely">很少</option>
                            <option value="monthly">每月</option>
                            <option value="weekly">每周</option>
                            <option value="daily">每天</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="satisfaction_level">满意度 *</label>
                        <select id="satisfaction_level" name="satisfaction_level" required>
                            <option value="">请选择满意度</option>
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">🔮 进行预测</button>
                </form>

                <div id="errorMessage" class="error-message"></div>

                <div id="resultBox" class="result-box">
                    <h3 style="margin-bottom: 15px; color: #4a5568;">预测结果</h3>
                    <div class="result-item">
                        <span class="result-label">预测结果：</span>
                        <span id="predictionResult" class="result-value"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">置信度：</span>
                        <span id="confidenceResult" class="result-value" style="color: #667eea;"></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📈 模型评估结果</h2>

                <div class="tabs">
                    <button class="tab active" data-tab="test">测试集</button>
                    <button class="tab" data-tab="train">训练集</button>
                </div>

                <div id="testTab" class="tab-content active">
                    <div id="testMetricsContainer">
                        <div class="metrics-grid" id="testMetrics">
                            <div class="metric-card">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <div>加载中...</div>
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <div>加载中...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="trainTab" class="tab-content">
                    <div id="trainMetricsContainer">
                        <div class="metrics-grid" id="trainMetrics">
                            <div class="metric-card">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <div>加载中...</div>
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <div>加载中...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card full-width">
                <h2>🎯 特征重要性分析</h2>
                <div id="featureImportanceContainer">
                    <div class="chart-container">
                        <canvas id="importanceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let evaluationData = null;
        let importanceChart = null;
        let hasGlobalError = false;

        function showGlobalError(message) {
            hasGlobalError = true;
            const errorDiv = document.getElementById('globalError');
            document.getElementById('globalErrorText').textContent = message;
            errorDiv.classList.add('show');
        }

        function hideGlobalError() {
            hasGlobalError = false;
            const errorDiv = document.getElementById('globalError');
            errorDiv.classList.remove('show');
        }

        function renderError(containerId, message, retryCallback = null) {
            const container = document.getElementById(containerId);
            if (!container) return;

            let retryButton = '';
            if (retryCallback) {
                retryButton = `<button onclick="(${retryCallback.toString()})()">重试</button>`;
            }

            container.innerHTML = `
                <div class="error-display">
                    <h4>❌ 加载失败</h4>
                    <p>${message}</p>
                    ${retryButton}
                </div>
            `;
        }

        function renderEmptyMetrics(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">-</div>
                        <div class="metric-label">准确率</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">-</div>
                        <div class="metric-label">F1-score</div>
                    </div>
                </div>
            `;
        }

        async function loadModelInfo() {
            try {
                const response = await fetch('/api/model-info');
                const result = await response.json();

                if (result.success) {
                    const info = result.data;
                    const list = document.getElementById('modelInfoList');
                    list.innerHTML = `
                        <li>模型类型: ${info.model_type}</li>
                        <li>基学习器: ${info.base_estimators.join(', ')}</li>
                        <li>投票方式: ${info.voting}</li>
                        <li>特征数量: ${info.features.length}</li>
                    `;
                    hideGlobalError();
                } else {
                    renderError('modelInfoContainer', result.error || '无法获取模型信息');
                }
            } catch (error) {
                console.error('Failed to load model info:', error);
                renderError('modelInfoContainer', '网络错误: ' + error.message);
                showGlobalError('无法连接到服务器，请确保后端服务已启动。');
            }
        }

        async function loadEvaluation() {
            try {
                const response = await fetch('/api/evaluation');
                const result = await response.json();

                if (result.success) {
                    evaluationData = result.data;
                    updateMetricsDisplay();
                    hideGlobalError();
                } else {
                    renderError('testMetricsContainer', result.error || '无法获取评估数据');
                    renderError('trainMetricsContainer', result.error || '无法获取评估数据');
                }
            } catch (error) {
                console.error('Failed to load evaluation:', error);
                renderError('testMetricsContainer', '网络错误: ' + error.message);
                renderError('trainMetricsContainer', '网络错误: ' + error.message);
                showGlobalError('无法连接到服务器，请确保后端服务已启动。');
            }
        }

        function updateMetricsDisplay() {
            if (!evaluationData) return;

            const test = evaluationData.test || evaluationData.overall;
            const train = evaluationData.train;

            if (test) {
                document.getElementById('testMetricsContainer').innerHTML = `
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-value">${(test.accuracy * 100).toFixed(1)}%</div>
                            <div class="metric-label">测试集准确率</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value">${(test.f1_score * 100).toFixed(1)}%</div>
                            <div class="metric-label">测试集 F1-score</div>
                        </div>
                    </div>
                `;
            } else {
                renderEmptyMetrics('testMetricsContainer');
            }

            if (train) {
                document.getElementById('trainMetricsContainer').innerHTML = `
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-value">${(train.accuracy * 100).toFixed(1)}%</div>
                            <div class="metric-label">训练集准确率</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value">${(train.f1_score * 100).toFixed(1)}%</div>
                            <div class="metric-label">训练集 F1-score</div>
                        </div>
                    </div>
                `;
            } else {
                renderEmptyMetrics('trainMetricsContainer');
            }
        }

        async function loadFeatureImportance() {
            try {
                const response = await fetch('/api/feature-importance');
                const result = await response.json();

                if (result.success) {
                    renderFeatureImportance(result.data);
                    hideGlobalError();
                } else {
                    renderError('featureImportanceContainer', result.error || '无法获取特征重要性');
                }
            } catch (error) {
                console.error('Failed to load feature importance:', error);
                renderError('featureImportanceContainer', '网络错误: ' + error.message);
                showGlobalError('无法连接到服务器，请确保后端服务已启动。');
            }
        }

        function renderFeatureImportance(data) {
            const labels = Object.keys(data);
            const values = Object.values(data);

            if (labels.length === 0) {
                renderError('featureImportanceContainer', '没有特征重要性数据');
                return;
            }

            const colors = labels.map((_, i) => {
                const hue = (i * 360 / labels.length);
                return `hsla(${hue}, 70%, 60%, 0.7)`;
            });

            const ctx = document.getElementById('importanceChart').getContext('2d');

            if (importanceChart) {
                importanceChart.destroy();
            }

            importanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '特征重要性',
                        data: values,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c.replace('0.7', '1')),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: '各特征对预测结果的影响程度',
                            font: {
                                size: 16
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '重要性得分'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '特征名称'
                            }
                        }
                    }
                }
            });
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                const tabName = tab.dataset.tab;
                document.getElementById(tabName + 'Tab').classList.add('active');
            });
        });

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultBox = document.getElementById('resultBox');
            const errorMessage = document.getElementById('errorMessage');

            resultBox.classList.remove('show');
            errorMessage.classList.remove('show');

            const formData = {
                age: parseInt(document.getElementById('age').value),
                income: parseFloat(document.getElementById('income').value),
                gender: document.getElementById('gender').value,
                visit_frequency: document.getElementById('visit_frequency').value,
                satisfaction_level: document.getElementById('satisfaction_level').value
            };

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    const predictionSpan = document.getElementById('predictionResult');
                    predictionSpan.textContent = result.data.prediction_label;
                    predictionSpan.className = 'result-value ' +
                        (result.data.prediction === 1 ? 'positive' : 'negative');

                    document.getElementById('confidenceResult').textContent =
                        result.data.confidence_percent + '%';

                    resultBox.classList.add('show');
                } else {
                    errorMessage.textContent = '预测失败: ' + result.error;
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = '网络错误: ' + error.message;
                errorMessage.classList.add('show');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadModelInfo();
            loadEvaluation();
            loadFeatureImportance();
        });
    </script>
</body>
</html>
